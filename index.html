<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GymBro">
<meta name="description" content="GymBro: каталог готовых программ тренировок, генератор с периодизацией, своя программа. Работает офлайн на любом устройстве.">
<meta property="og:title" content="GymBro — тренировки">
<meta property="og:description" content="Каталог легендарных программ + генератор под тебя. Работает офлайн.">
<meta property="og:type" content="website">
<title>GymBro — программы тренировок</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<script>
/* Тема до первого кадра — чтобы не было вспышки */
try {
  var s = JSON.parse(localStorage.getItem("gymbro.settings") || "{}");
  var t = ["light", "dark"].includes(s.theme) ? s.theme :
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = t;
  document.documentElement.dataset.anim = s.anim === false ? "off" : "on";
} catch (e) {}
</script>
</head>
<body>

<!-- ===== Иконки (Sprite) ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>

  </symbol>
  <symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="2" width="15" height="20" rx="2"/><path d="M9 22v-4h6v4M8.5 7h1M14.5 7h1M8.5 11h1M14.5 11h1"/>
  </symbol>

  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <path d="M2 15c2.5 0 2.5-6 5-6s2.5 6 5 6 2.5-6 5-6 2.5 6 5 6"/>

  </symbol>

    <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.34a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.25.6.84 1.03 1.51 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>
  </symbol>
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2"/>

  </symbol>

    <path d="M8 8.5 6.7 6.3M16 8.5l1.3-2.2M9.5 10.5h.01M14.5 10.5h.01"/>

</svg>

<div class="device">

  <!-- Фон-аврора (стекло) -->
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- ============ ГЛАВНАЯ ============ -->
  <section class="screen" id="screen-home">
    <header class="app-bar">
      <div class="ab-left">
        <div class="ab-logo"><svg class="ic"><use href="#i-dumbbell"/></svg></div>
        <h1 class="ab-title brand">GymBro</h1>
      </div>
      <div class="ab-right">
        <button class="ab-btn" id="btn-catalog" aria-label="Каталог программ"><svg class="ic"><use href="#i-grid"/></svg></button>
        <button class="ab-btn" id="btn-settings" aria-label="Настройки"><svg class="ic"><use href="#i-gear"/></svg></button>
      </div>
    </header>

    <main class="scroll" id="home-scroll">
      <div class="greet-row">
        <h2 class="large-title">Программы</h2>
        <span class="today-chip" id="today-chip"></span>
      </div>

      <button class="catalog-banner rise" id="btn-catalog-home">
        <div class="cb-icon"><svg class="ic"><use href="#i-sparkle"/></svg></div>
        <div class="cb-text">
          <b>Каталог готовых программ</b>
          <span>StrongLifts, 5/3/1, PPL, PHUL и другие — проверенные легенды, добавляются одним тапом</span>
        </div>
        <span class="chev"><svg class="ic"><use href="#i-chev-r"/></svg></span>
      </button>

      <button class="install-chip rise" id="btn-install-home" style="--i:1">
        <svg class="ic"><use href="#i-download"/></svg>
        <span>Установить как приложение</span>
      </button>

      <div id="home-content">
        <div class="empty" id="home-empty" hidden>
          <div class="empty-badge"><svg class="ic"><use href="#i-dumbbell"/></svg></div>
          <h3>Пока пусто</h3>
          <p>Создай свою программу, собери генератор или возьми готовую из каталога.</p>
        </div>

        <div id="plans-section" hidden>
          <h3 class="section-label">Мои планы</h3>
          <div class="card" id="plans-list"></div>
        </div>
      </div>
    </main>

    <footer class="bottom-bar">
      <button class="btn btn-primary" id="btn-new-plan">
        <svg class="ic"><use href="#i-plus"/></svg>
        Новая программа
      </button>
    </footer>
  </section>

  <!-- ============ КАТАЛОГ ПРОГРАММ ============ -->
  <section class="screen" id="screen-catalog" hidden>
    <header class="app-bar">
      <div class="ab-left">
        <button class="ab-btn" id="btn-catalog-back" aria-label="Назад"><svg class="ic"><use href="#i-chev-l"/></svg></button>
        <h1 class="ab-title" id="catalog-ab-title">Каталог</h1>
      </div>
    </header>
    <main class="scroll" id="catalog-scroll"></main>
    <footer class="bottom-bar" id="catalog-footer">
      <button class="btn btn-primary" id="btn-prog-add" hidden>
        <svg class="ic"><use href="#i-plus"/></svg>
        <span>Добавить в мои планы</span>
      </button>
    </footer>
  </section>

  <!-- ============ МАСТЕР (bottom sheet) ============ -->
  <div class="overlay" id="wiz-overlay" hidden></div>
  <section class="sheet sheet-lg" id="sheet-wizard" hidden>
    <div class="sheet-grab"><span></span></div>
    <header class="sheet-nav">
      <button class="nav-btn" id="wiz-cancel">Отмена</button>
      <div class="nav-progress"><i id="wiz-dot-1" class="on"></i><i id="wiz-dot-2"></i><i id="wiz-dot-3"></i><i id="wiz-dot-4"></i></div>
      <button class="nav-btn accent" id="wiz-next">Далее</button>
    </header>
    <div class="sheet-body" id="wizard-body"></div>
  </section>

  <!-- ============ КОНСТРУКТОР СВОЕЙ ПРОГРАММЫ ============ -->
  <section class="screen" id="screen-build" hidden>
    <header class="app-bar">
      <div class="ab-left">
        <button class="ab-btn" id="btn-build-back" aria-label="Назад"><svg class="ic"><use href="#i-chev-l"/></svg></button>
        <h1 class="ab-title" id="build-title">Своя программа</h1>
      </div>
      <div class="ab-right">
        <button class="ab-btn accent" id="btn-build-save" aria-label="Сохранить">
          <svg class="ic"><use href="#i-check"/></svg>
          <span>Сохранить</span>
        </button>
      </div>
    </header>

    <div style="padding:0 16px;margin-top:12px">
      <div class="input-card">
        <input id="inp-build-title" maxlength="60" placeholder="Название программы" autocomplete="off">
        <button class="clear" id="btn-clear-build-title" aria-label="Очистить"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
    </div>

    <div style="padding:0 16px;margin-top:16px">
      <div class="segmented" id="build-day-tabs"></div>
    </div>

    <main class="scroll" id="build-scroll">
      <div id="build-days"></div>
    </main>

    <footer class="bottom-bar three">
      <button class="btn btn-quiet" id="btn-build-add-day"><svg class="ic"><use href="#i-plus"/></svg><span>День</span></button>
      <button class="btn btn-fill" id="btn-build-add-ex"><svg class="ic"><use href="#i-search"/></svg><span>Упражнение</span></button>
      <button class="btn btn-quiet danger" id="btn-build-del-day"><svg class="ic"><use href="#i-trash"/></svg><span>День</span></button>
    </footer>
  </section>

  <!-- ============ ВЫБОР УПРАЖНЕНИЯ (палитра) ============ -->
  <div class="overlay" id="pick-overlay" hidden></div>
  <section class="sheet sheet-lg" id="sheet-pick" hidden>
    <div class="sheet-grab"><span></span></div>
    <div style="padding:0 16px">
      <div class="input-card">
        <input id="inp-pick-search" maxlength="40" placeholder="Поиск упражнения…" autocomplete="off">
        <button class="clear" id="btn-clear-pick-search" aria-label="Очистить"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="chip-row" id="pick-muscle-filters" style="margin-top:12px"></div>
    </div>
    <div class="sheet-body" id="pick-list"></div>
    <footer class="bottom-bar">
      <button class="btn btn-primary" id="btn-pick-done">Готово</button>
    </footer>
  </section>

  <!-- ============ ПЛАН ============ -->
  <section class="screen" id="screen-plan" hidden>
    <header class="app-bar">
      <div class="ab-left">
        <button class="ab-btn" id="btn-back-home" aria-label="Назад"><svg class="ic"><use href="#i-chev-l"/></svg></button>
        <h1 class="ab-title" id="plan-ab-title">План</h1>
      </div>
      <div class="ab-right">
        <button class="ab-btn" id="btn-edit-plan" aria-label="Редактировать"><svg class="ic"><use href="#i-pencil"/></svg></button>
        <button class="ab-btn danger" id="btn-delete-plan" aria-label="Удалить"><svg class="ic"><use href="#i-trash"/></svg></button>
      </div>
    </header>

    <div class="plan-hero" id="plan-hero"></div>

    <div class="segmented" id="plan-view-toggle" hidden>
      <button class="on" data-pv="days">По дням</button>
      <button data-pv="weeks">График месяца</button>
    </div>

    <div class="segmented" id="day-tabs"></div>
    <div class="wave-tabs" id="wave-tabs" hidden></div>

    <main class="scroll" id="plan-scroll"></main>

    <footer class="bottom-bar two">
      <button class="btn btn-fill" id="btn-share-plan"><svg class="ic"><use href="#i-send"/></svg><span>Поделиться</span></button>
      <button class="btn btn-quiet" id="btn-new-again"><svg class="ic"><use href="#i-plus"/></svg><span>Новый</span></button>
    </footer>
  </section>

  <!-- ============ SHEET: инфо об упражнении ============ -->
  <div class="overlay thin" id="info-overlay" hidden></div>
  <section class="sheet" id="sheet-exercise" hidden>
    <div class="sheet-grab"><span></span></div>
    <div class="sheet-body" id="exercise-body"></div>
    <footer class="bottom-bar"><button class="btn btn-primary" id="btn-close-info">Закрыть</button></footer>
  </section>

  <!-- ============ SHEET: настройки ============ -->
  <div class="overlay" id="set-overlay" hidden></div>
  <section class="sheet" id="sheet-settings" hidden>
    <div class="sheet-grab"><span></span></div>
    <header class="sheet-nav">
      <button class="nav-btn accent" id="btn-close-settings" style="margin-left:auto">Готово</button>
    </header>
    <div class="sheet-body">
      <h3 class="sheet-title">Настройки</h3>

      <div class="field-label">Тема оформления</div>
      <div class="theme-row">
        <button class="theme-opt" data-th="system"><svg class="ic"><use href="#i-auto"/></svg><span>Авто</span></button>
        <button class="theme-opt" data-th="light"><svg class="ic"><use href="#i-sun"/></svg><span>Светлая</span></button>
        <button class="theme-opt" data-th="dark"><svg class="ic"><use href="#i-moon"/></svg><span>Тёмная</span></button>
      </div>

      <div class="field-label" style="margin-top:22px">Ещё</div>
      <div class="rows">
        <button class="row" id="sw-anim" role="switch" aria-label="Анимации">
          <svg class="ic"><use href="#i-zap"/></svg>
          <span class="k">Анимации</span>
          <span class="switch"><i></i></span>
        </button>
        <button class="row" id="btn-open-guide">
          <svg class="ic"><use href="#i-download"/></svg>
          <span class="k">Как установить приложение</span>
          <span class="chev"><svg class="ic"><use href="#i-chev-r"/></svg></span>
        </button>
      </div>

      <p class="settings-foot">GymBro · всё хранится локально на твоём устройстве, без аккаунтов и серверов.</p>
    </div>
  </section>

  <!-- ============ SHEET: гайд установки ============ -->
  <div class="overlay" id="guide-overlay" hidden></div>
  <section class="sheet" id="sheet-guide" hidden>
    <div class="sheet-grab"><span></span></div>
    <header class="sheet-nav">
      <button class="nav-btn accent" id="btn-close-guide" style="margin-left:auto">Закрыть</button>
    </header>
    <div style="padding:0 16px">
      <div class="segmented static" id="guide-tabs">
        <button data-gp="ios" class="on"><svg class="ic"><use href="#i-apple"/></svg></button>
        <button data-gp="android"><svg class="ic"><use href="#i-android"/></svg></button>
        <button data-gp="desktop"><svg class="ic"><use href="#i-laptop"/></svg></button>
      </div>
    </div>
    <div class="sheet-body" id="guide-body"></div>
  </section>

  <!-- ============ iOS Alert ============ -->
  <div class="alert-wrap" id="alert-wrap" hidden>
    <div class="alert" role="alertdialog" aria-modal="true">
      <div class="alert-icon" id="alert-icon" hidden><svg class="ic"><use href="#i-trash"/></svg></div>
      <h4 id="alert-title"></h4>
      <p id="alert-msg"></p>
      <div class="alert-actions" id="alert-actions"></div>
    </div>
  </div>

  <!-- ============ HUD (ошибки / статусы) ============ -->
  <div class="hud" id="hud" hidden><span id="hud-text"></span></div>

  <div class="home-indicator"></div>
</div>

<script src="./planner.js"></script>
<script src="./app.js"></script>

// Service worker для офлайн-режима
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
