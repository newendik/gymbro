<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Бесплатный генератор персональных программ тренировок: цель, уровень, дни, инвентарь — 71 упражнение с техниками. Работает офлайн.">
<meta property="og:title" content="GymBro — генератор тренировок">
<meta property="og:description" content="Персональная программа за 5 шагов. Работает на любом устройстве без установки.">
<meta property="og:type" content="website">
<title>GymBro — генератор программ тренировок</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ===== Иконки (Sprite) ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <symbol id="i-dumbbell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 7.5v9M17.5 7.5v9M3.5 10v4M20.5 10v4M6.5 12h11"/>
  </symbol>
  <symbol id="i-barbell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 9v6M7 7.5v9M17 7.5v9M20.5 9v6M7 12h10"/>
  </symbol>
  <symbol id="i-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
  </symbol>
  <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
  </symbol>
  <symbol id="i-sprout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21v-9M12 12C12 8.5 9 6 5 6c0 3.5 3 6 7 6zM12 12c0-3.5 3-6 7-6 0 3.5-3 6-7 6z"/>
  </symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
  </symbol>
  <symbol id="i-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
  </symbol>
  <symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="2" width="15" height="20" rx="2"/><path d="M9 22v-4h6v4M8.5 7h1M14.5 7h1M8.5 11h1M14.5 11h1"/>
  </symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9.5 12 3l9 6.5"/><path d="M5 9.5V20a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 20V9.5"/><path d="M9 21.5V14h6v7.5"/>
  </symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M16 2.5v4M8 2.5v4M3 11.5h18"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
  </symbol>
  <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m12 2.5 9.5 5-9.5 5-9.5-5 9.5-5z"/><path d="m2.5 16.5 9.5 5 9.5-5M2.5 12l9.5 5 9.5-5"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="m4.5 12.5 5 5 10-11"/>
  </symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m9 5 7 7-7 7"/>
  </symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m15 5-7 7 7 7"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 6 6 18M6 6l12 12"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 6h17M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.5 2.5 11 13"/><path d="M21.5 2.5 15 22l-4-9-9-4 19.5-6.5z"/>
  </symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"/><path d="M12 16v-5M12 8h.01"/>
  </symbol>
</defs>
</svg>

<div class="device">

  <!-- ============ ГЛАВНАЯ ============ -->
  <section class="screen" id="screen-home">
    <header class="app-bar">
      <div class="ab-left">
        <div class="ab-logo"><svg class="ic"><use href="#i-dumbbell"/></svg></div>
        <h1 class="ab-title">GymBro</h1>
      </div>
      <div class="ab-right">
        <button class="ab-btn" id="btn-about" aria-label="О приложении"><svg class="ic"><use href="#i-info"/></svg></button>
      </div>
    </header>

    <main class="scroll" id="home-scroll">
      <div class="greet-row">
        <h2 class="large-title" id="greeting">Привет</h2>
        <span class="today-chip" id="today-chip"></span>
      </div>

      <div id="home-content">
        <div class="empty" id="home-empty" hidden>
          <div class="empty-badge"><svg class="ic"><use href="#i-dumbbell"/></svg></div>
          <h3>Ни одного плана</h3>
          <p>Создай первую программу — мастер задаст несколько вопросов и соберёт тренировки под тебя.</p>
        </div>

        <div id="plans-section" hidden>
          <h3 class="section-label">Мои планы</h3>
          <div class="card" id="plans-list"></div>
        </div>
      </div>
    </main>

    <footer class="bottom-bar">
      <button class="btn btn-primary" id="btn-new-plan">
        <svg class="ic"><use href="#i-plus"/></svg>
        Новая программа
      </button>
    </footer>
  </section>

  <!-- ============ МАСТЕР (bottom sheet) ============ -->
  <div class="overlay" id="wiz-overlay" hidden></div>
  <section class="sheet sheet-lg" id="sheet-wizard" hidden>
    <div class="sheet-grab"><span></span></div>
    <header class="sheet-nav">
      <button class="nav-btn" id="wiz-cancel">Отмена</button>
      <div class="nav-progress"><i id="wiz-dot-1" class="on"></i><i id="wiz-dot-2"></i><i id="wiz-dot-3"></i><i id="wiz-dot-4"></i><i id="wiz-dot-5"></i></div>
      <button class="nav-btn accent" id="wiz-next">Далее</button>
    </header>
    <div class="sheet-body" id="wizard-body"></div>
  </section>

  <!-- ============ ПЛАН ============ -->
  <section class="screen" id="screen-plan" hidden>
    <header class="app-bar">
      <div class="ab-left">
        <button class="ab-btn" id="btn-back-home" aria-label="Назад"><svg class="ic"><use href="#i-chev-l"/></svg></button>
        <h1 class="ab-title" id="plan-ab-title">План</h1>
      </div>
      <div class="ab-right">
        <button class="ab-btn danger" id="btn-delete-plan" aria-label="Удалить"><svg class="ic"><use href="#i-trash"/></svg></button>
      </div>
    </header>

    <div class="plan-hero" id="plan-hero"></div>

    <div class="segmented" id="day-tabs"></div>

    <main class="scroll" id="plan-scroll"></main>

    <footer class="bottom-bar two">
      <button class="btn btn-fill" id="btn-share-plan"><svg class="ic"><use href="#i-send"/></svg><span>Поделиться</span></button>
      <button class="btn btn-quiet" id="btn-new-again"><svg class="ic"><use href="#i-plus"/></svg><span>Новый</span></button>
    </footer>
  </section>

  <!-- ============ SHEET: инфо об упражнении ============ -->
  <div class="overlay thin" id="info-overlay" hidden></div>
  <section class="sheet" id="sheet-exercise" hidden>
    <div class="sheet-grab"><span></span></div>
    <div class="sheet-body" id="exercise-body"></div>
    <footer class="bottom-bar"><button class="btn btn-primary" id="btn-close-info">Закрыть</button></footer>
  </section>

  <!-- ============ iOS Alert ============ -->
  <div class="alert-wrap" id="alert-wrap" hidden>
    <div class="alert" role="alertdialog" aria-modal="true">
      <div class="alert-icon" id="alert-icon" hidden><svg class="ic"><use href="#i-trash"/></svg></div>
      <h4 id="alert-title"></h4>
      <p id="alert-msg"></p>
      <div class="alert-actions" id="alert-actions"></div>
    </div>
  </div>

  <!-- ============ HUD (ошибки / статусы) ============ -->
  <div class="hud" id="hud" hidden><span id="hud-text"></span></div>

  <div class="home-indicator"></div>
</div>

<script src="./planner.js"></script>
<script src="./app.js"></script>
<script>
// Service worker для офлайн-режима
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
